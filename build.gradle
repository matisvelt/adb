plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.14'
}

group = 'com.antlab'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

def gitHash = "unknown"
try {
    def proc = ["git", "rev-parse", "--short", "HEAD"].execute(null, rootDir)
    proc.waitFor()
    if (proc.exitValue() == 0) {
        gitHash = proc.in.text.trim()
    }
} catch (Exception ignored) {
}

javafx {
    version = '21.0.2'
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

application {
    mainClass = 'com.antlab.rigcontrol.App'
    applicationName = 'System Thinker'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes(
                'Implementation-Title': 'System Thinker',
                'Implementation-Version': gitHash
        )
    }
}

tasks.register('jpackageApp', Exec) {
    dependsOn tasks.jar
    def javaHome = System.getenv("JAVA_HOME") ?: ""
    def javaBin = javaHome ? "${javaHome}/bin/jpackage" : "jpackage"
    def inputDir = file("${buildDir}/libs")
    def appName = "System Thinker"
    def mainJar = tasks.jar.archiveFile.get().asFile.name
    def modulePath = configurations.runtimeClasspath.asPath
    def addModules = "javafx.controls,javafx.fxml,java.logging,java.prefs,java.desktop"
    commandLine javaBin,
            "--type", "dmg",
            "--input", inputDir.absolutePath,
            "--dest", file("${buildDir}/jpackage").absolutePath,
            "--name", appName,
            "--main-jar", mainJar,
            "--main-class", application.mainClass.get(),
            "--icon", file("assets/system-thinker.icns").absolutePath,
            "--module-path", modulePath,
            "--add-modules", addModules
}
